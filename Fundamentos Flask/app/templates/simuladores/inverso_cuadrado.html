{% extends "base.html" %}

{% block content %}
<div class="simulator-layout">
    <!-- Controles Izquierda -->
    <aside class="controls-panel glass-panel">
        <h3>Parámetros</h3>
        
        <div class="control-group">
            <label for="scenario">Fuerza a simular</label>
            <select id="scenario">
                <option value="gravedad">Gravitación Universal</option>
                <option value="coulomb">Ley de Coulomb</option>
            </select>
        </div>

        <div class="control-group">
            <label id="lbl-dist">Distancia ($r$)</label>
            <div class="input-with-unit">
                <input type="number" id="dist-num" value="5" step="0.1" title="Entrada manual">
                <select id="dist-unit">
                    <option value="m">m (Metros)</option>
                    <option value="km">km</option>
                    <option value="au">AU</option>
                    <option value="ly">Años Luz</option>
                </select>
            </div>
            <input type="range" id="distancia" min="0.1" max="20" step="0.1" value="5">
        </div>

        <div class="control-group" id="grp-val1">
            <label id="lbl-val1">Cuerpo 1</label>
            <div class="input-with-unit">
                <input type="number" id="v1-num" value="1000" step="1">
                <select id="v1-unit">
                    <!-- Se llenará dinámicamente según JS -->
                </select>
            </div>
            <input type="range" id="valor1" min="1" max="10000" step="1" value="1000">
        </div>

        <div class="control-group" id="grp-val2">
            <label id="lbl-val2">Cuerpo 2</label>
            <div class="input-with-unit">
                <input type="number" id="v2-num" value="500" step="1">
                <select id="v2-unit">
                    <!-- Se llenará dinámicamente según JS -->
                </select>
            </div>
            <input type="range" id="valor2" min="1" max="10000" step="1" value="500">
        </div>
        
        <div class="telemetry glass-panel inner-panel">
            <h4>Telemetría</h4>
            <p><strong>Cálculo Realizado:</strong></p>
            <p class="formula-text" id="formula-text">Calculando...</p>
            <h2 id="fuerza-result">0 N</h2>
        </div>
    </aside>

    <!-- Visualización y Chart Derecha -->
    <section class="visual-panel">
        <div class="canvas-container glass-panel">
            <canvas id="physics-canvas"></canvas>
            <div class="canvas-hint">Arrastra los cuerpos para ajustar la distancia ($r$) 2D</div>
        </div>
        <div class="chart-container glass-panel">
            <canvas id="physics-chart"></canvas>
        </div>
    </section>
</div>
{% endblock %}

{% block head %}
    <script defer src="{{ url_for('static', filename='js/modules/inverso_cuadrado.js') }}"></script>
    <style>
        .input-with-unit {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
            width: 100%;
        }
        .input-with-unit input[type="number"] {
            flex: 1 1 50%;
            min-width: 0;
            padding: 0.4rem;
            background: rgba(0, 0, 0, 0.2);
            color: #f8fafc;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            font-family: inherit;
        }
        .input-with-unit select {
            flex: 1 1 50%;
            min-width: 0;
            padding: 0.4rem;
            background: rgba(0, 0, 0, 0.2);
            color: #f8fafc;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
        }
        .canvas-container { position: relative; }
        .canvas-hint { 
            position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
            font-size: 0.8rem; color: var(--text-muted); pointer-events: none;
        }
    </style>
{% endblock %}
